<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local It: local stores near you</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3a2c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7e6;--surface:#fff;--ink:#0f3a2c;--muted:#5d7468;--line:#dbe4c8;--accent:#ff6a2b;--on-accent:#fff;--chip:#e6efcf;--ok:#1c8a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f18;--surface:#15302a;--ink:#eaf5df;--muted:#9bb5a6;--line:#27463b;--chip:#1d3d33;--ok:#53d08f}}
:root[data-theme="dark"]{--bg:#0d1f18;--surface:#15302a;--ink:#eaf5df;--muted:#9bb5a6;--line:#27463b;--chip:#1d3d33;--ok:#53d08f}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;min-height:100vh;padding-bottom:96px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.eta{font-size:clamp(34px,8vw,52px);font-weight:800;line-height:.95;letter-spacing:-.03em}
.eta small{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:6px}
.logo{font-weight:800;font-size:18px;background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:999px}
.search{margin-top:12px;width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px}
.chip{flex:none;border:0;background:var(--chip);padding:8px 14px;border-radius:999px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column}
.pic{font-size:54px;text-align:center;background:var(--chip);border-radius:12px;padding:10px 0}
.card h3{font-size:15px;font-weight:700;margin:10px 0 2px}
.qty{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.price{font-weight:800}
.add{border:1.5px solid var(--ok);color:var(--ok);background:transparent;border-radius:10px;padding:6px 18px;font-weight:700}
.step{display:inline-flex;align-items:center;background:var(--ok);color:#fff;border-radius:10px;overflow:hidden}
.step button{background:none;border:0;color:#fff;padding:6px 11px;font-weight:800;font-size:16px}
.step span{min-width:18px;text-align:center;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:6}
.bar.on{display:block}
.bar button{width:100%;max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--accent);color:var(--on-accent);padding:14px 18px;border-radius:16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .nm{flex:1}
.bill{background:var(--surface);border-radius:14px;padding:12px 14px;margin:14px 0}
.bill div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.bill .tot{font-weight:800;font-size:17px;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.note{font-size:13px;color:var(--ok);font-weight:500;margin:8px 0}
.field{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.cta{width:100%;margin-top:12px;border:0;background:var(--accent);color:var(--on-accent);padding:14px;border-radius:14px;font-weight:800;font-size:16px}
.ghost{background:none;border:0;color:var(--muted);float:right;font-size:22px}
.track{list-style:none;padding:0;margin:16px 0}
.track li{padding:10px 0 10px 34px;position:relative;color:var(--muted)}
.track li::before{content:"";position:absolute;left:4px;top:12px;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.track li.done{color:var(--ink);font-weight:700}
.track li.done::before{background:var(--ok);border-color:var(--ok)}
.big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:none;font-size:14px}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
.loc{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="eta">From your<br>neighbourhood<small>Local stores · delivery within 4 km · free over ₹199 per store</small></div>
    <div class="logo">Local It</div>
  </div>
  <div class="loc"><span id="locTxt" style="font-weight:700;font-size:14px;flex:1 1 100%">📍 Set your location to see stores near you</span><button class="chip" onclick="useGPS()">Use my location</button><input class="field" id="pin" value="110091" inputmode="numeric" maxlength="6" aria-label="Pincode" style="width:100px;padding:7px 10px"><button class="chip" onclick="usePin()">Use pincode</button></div>
  <input class="search" id="q" type="search" placeholder="Search for milk, chips, tomatoes…" aria-label="Search products">
  <div class="chips" id="chips" role="group" aria-label="Categories"></div>
</div></header>

<main class="wrap"><div class="grid" id="grid"></div></main>

<div class="bar" id="bar"><button id="openCart"><span id="barQty"></span><span id="barTotal"></span></button></div>

<div class="sheet" id="cartSheet"><div class="panel" role="dialog" aria-label="Your cart" id="cartPanel"></div></div>
<div class="sheet" id="trackSheet"><div class="panel" role="dialog" aria-label="Order tracking" id="trackPanel"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
let P=[
["🥛","Toned milk","500 ml",29,"Dairy"],["🧈","Salted butter","100 g",58,"Dairy"],["🧀","Cheese slices","200 g",135,"Dairy"],["🥚","Farm eggs","6 pcs",54,"Dairy"],
["🍅","Tomato","500 g",32,"Fresh"],["🧅","Onion","1 kg",44,"Fresh"],["🥔","Potato","1 kg",38,"Fresh"],["🥬","Spinach","250 g",25,"Fresh"],["🍌","Banana","6 pcs",42,"Fresh"],["🍎","Apple","4 pcs",120,"Fresh"],
["🍟","Masala chips","52 g",20,"Snacks"],["🍪","Choco cookies","120 g",35,"Snacks"],["🥜","Salted peanuts","200 g",60,"Snacks"],["🍫","Dark chocolate","80 g",110,"Snacks"],
["🧃","Mango juice","1 L",99,"Drinks"],["🥤","Cola","750 ml",40,"Drinks"],["☕","Instant coffee","50 g",160,"Drinks"],["🍵","Masala tea","250 g",125,"Drinks"],
["🍞","Brown bread","400 g",50,"Pantry"],["🍚","Basmati rice","1 kg",135,"Pantry"],["🌾","Atta","5 kg",260,"Pantry"],["🫒","Mustard oil","1 L",185,"Pantry"],["🧂","Iodised salt","1 kg",28,"Pantry"],["🍜","Instant noodles","4 pack",56,"Pantry"]
].map((p,i)=>({id:i,e:p[0],n:p[1],q:p[2],p:p[3],c:p[4]}));
let cats=["All",...new Set(P.map(p=>p.c))];
let cat="All",cart={},timer=null;
const $=id=>document.getElementById(id);
const inr=n=>"₹"+n;
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",1600)}

function ctl(id){const n=cart[id]||0;
  return n? `<div class="step"><button data-d="-1" data-id="${id}" aria-label="Remove one">−</button><span>${n}</span><button data-d="1" data-id="${id}" aria-label="Add one">+</button></div>`
          : `<button class="add" data-d="1" data-id="${id}">ADD</button>`}
function renderChips(){$("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-cat="${c}">${c}</button>`).join("")}
function renderGrid(){
  const s=$("q").value.trim().toLowerCase();
  const list=P.filter(p=>(cat==="All"||p.c===cat)&&p.n.toLowerCase().includes(s));
  $("grid").innerHTML=list.length?list.map(p=>`<article class="card"><div class="pic" aria-hidden="true">${esc(p.e)}</div><h3>${esc(p.n)}</h3><div class="qty">${esc(p.q)}</div><div class="qty">${esc(p.sn)}${p.d!=null?" · "+p.d.toFixed(1)+" km":""}</div><div class="row"><span class="price">${inr(p.p)}</span>${ctl(p.id)}</div></article>`).join(""):`<div class="empty">${s?"Nothing matches “"+esc(s)+"”. Try another word or pick a category.":MSG}</div>`;
}
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sub=()=>Object.entries(cart).reduce((a,[id,n])=>a+P[id].p*n,0);
function groups(){const g={};for(const [i,n] of Object.entries(cart)){const p=P[i];(g[p.sid]=g[p.sid]||[]).push({product_name:p.n,price:p.p,quantity:n,pid:p.pid,sn:p.sn})}return g}
function fees(){const g=groups();let s=0,del=0;for(const k in g){const t=g[k].reduce((a,x)=>a+x.price*x.quantity,0);s+=t;if(t<199)del+=25}return{s,del,hand:Object.keys(g).length*2}}
function renderBar(){const n=count();$("bar").classList.toggle("on",n>0);$("barQty").textContent=n+(n===1?" item":" items");$("barTotal").textContent="View cart · "+inr(sub())}
function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];renderGrid();renderBar();if($("cartSheet").classList.contains("on"))renderCart()}

function renderCart(){
  const ids=Object.keys(cart),f=fees(),tot=f.s+f.del+f.hand;
  if(!ids.length){$("cartPanel").innerHTML=`<button class="ghost" data-close="cartSheet" aria-label="Close">×</button><h2>Your cart is empty</h2><p class="qty">Add a few things and they will reach you in about 10 minutes.</p>`;return}
  $("cartPanel").innerHTML=`<button class="ghost" data-close="cartSheet" aria-label="Close">×</button><h2>Your cart</h2><div class="note">Delivered by local stores near you</div>
  ${ids.map(id=>{const p=P[id];return `<div class="line"><span style="font-size:30px">${esc(p.e)}</span><div class="nm"><b>${esc(p.n)}</b><div class="qty">${esc(p.q)} · ${inr(p.p)} · ${esc(p.sn)}</div></div>${ctl(id)}</div>`}).join("")}
  <div class="bill"><div><span>Items</span><span>${inr(f.s)}</span></div><div><span>Delivery</span><span>${f.del?inr(f.del):"Free"}</span></div><div><span>Handling</span><span>${inr(f.hand)}</span></div><div class="tot"><span>To pay</span><span>${inr(tot)}</span></div></div>
  <div class="note">Delivery is free on ₹199+ per store</div>
  <input class="field" id="cname" placeholder="Your name" autocomplete="name" style="margin-bottom:8px">
  <input class="field" id="cph" type="tel" placeholder="10-digit phone number" autocomplete="tel" style="margin-bottom:8px">
  <input class="field" id="addr" placeholder="Flat, building, street" autocomplete="street-address">
  <button class="cta" id="place">Place order · ${inr(tot)}</button>`;
}
function open(id){$(id).classList.add("on")}
function close(id){$(id).classList.remove("on")}

const steps=["Order placed","Packing your items","Rider is on the way","Delivered"];
async function placeOrder(){
  const a=$("addr").value.trim(),nm=$("cname").value.trim(),ph=$("cph").value.replace(/\D/g,"").slice(-10);
  if(!nm){$("cname").focus();toast("Enter your name");return}
  if(ph.length!==10){$("cph").focus();toast("Enter a 10-digit phone number");return}
  if(!a){$("addr").focus();toast("Enter a delivery address");return}
  const g=groups(),btn=$("place"),made=[];
  btn.disabled=true;btn.textContent="Placing order…";
  try{
    for(const sid in g){
      const it=g[sid];
      const r=await fetch(SB+"/rest/v1/rpc/place_order",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_store:sid==="null"?null:sid,p_name:nm,p_phone:ph,p_address:a,p_lat:loc?loc.lat:null,p_lng:loc?loc.lng:null,p_items:it.map(x=>({product_id:x.pid,quantity:x.quantity}))})});
      if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||"failed")}
      made.push({oid:await r.json(),sn:it[0].sn,st:"placed"});
    }
  }catch(e){btn.disabled=false;btn.textContent="Place order";console.error(e);toast(e.message?"Order failed: "+e.message.slice(0,140):"Could not place order. Please try again.");return}
  cart={};renderGrid();renderBar();close("cartSheet");open("trackSheet");
  const ORD=["placed","accepted","packing","on_the_way","delivered"],lbl=s=>s.replace(/_/g," ");
  const draw=()=>{$("trackPanel").innerHTML="<h2>Your order</h2>"+made.map(m=>`<div class="bill"><div><b>${esc(m.sn)}</b><span>${m.st==="cancelled"?"Cancelled":lbl(m.st)}</span></div>${m.st==="cancelled"?"":`<ul class="track">${ORD.map((s,k)=>`<li class="${ORD.indexOf(m.st)>=k?"done":""}">${lbl(s)}</li>`).join("")}</ul>`}</div>`).join("")+'<button class="cta" data-close="trackSheet">Keep browsing</button>'};
  draw();clearInterval(timer);
  timer=setInterval(async()=>{for(const m of made){try{const r=await fetch(SB+"/rest/v1/rpc/order_status",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({oid:m.oid})});if(r.ok){const s=await r.json();if(s)m.st=s}}catch(e){}}draw()},5000);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,.sheet");if(!t)return;
  if(t.dataset.d){change(+t.dataset.id,+t.dataset.d);return}
  if(t.dataset.cat){cat=t.dataset.cat;renderChips();renderGrid();return}
  if(t.dataset.close){close(t.dataset.close);return}
  if(t.id==="openCart"){renderCart();open("cartSheet");return}
  if(t.id==="place"){placeOrder();return}
  if(t.classList.contains("sheet")&&e.target===t)t.classList.remove("on");
});
$("q").addEventListener("input",renderGrid);
const SB="https://gxkdzqfhdjqzyregazyy.supabase.co",KEY="sb_publishable_U4PaFyaP1VQCDDrSwF0tPw_G4Os5WpD";
async function sb(table,body){const r=await fetch(SB+"/rest/v1/"+table,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text())}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let loc=null,MSG="Share your location (or pincode) to see local stores within 4 km.";
function hav(a,b,c,d){const r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),k=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(k))}
function setLoc(lat,lng,label){loc={lat,lng};$("locTxt").textContent="📍 "+label;loadProducts()}
function useGPS(){if(!navigator.geolocation){toast("Location not supported");return}navigator.geolocation.getCurrentPosition(p=>setLoc(p.coords.latitude,p.coords.longitude,"Using your current location"),()=>toast("Location blocked. Use pincode instead."),{timeout:10000})}
async function usePin(){const pc=$("pin").value.trim();if(!/^\d{6}$/.test(pc)){toast("Enter a 6-digit pincode");return}try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&country=India&postalcode="+pc),d=await r.json();if(!d.length){toast("Pincode not found");return}setLoc(+d[0].lat,+d[0].lon,"Pincode "+pc+" (approximate)")}catch(e){toast("Could not find that pincode")}}
async function loadProducts(){
  try{
    const o={headers:{apikey:KEY}};
    const [rs,rp]=await Promise.all([fetch(SB+"/rest/v1/stores?select=*&is_open=eq.true",o),fetch(SB+"/rest/v1/products?select=*&in_stock=eq.true&order=id",o)]);
    if(!rs.ok||!rp.ok)throw 0;
    const S={};
    (await rs.json()).forEach(s=>{const d=(s.lat!=null&&s.lng!=null&&loc)?hav(loc.lat,loc.lng,s.lat,s.lng):null;if(d==null||d<=(s.radius_km||4))S[s.id]={...s,d}});
    P=(await rp.json()).filter(x=>S[x.store_id]).map((x,i)=>({id:i,e:x.emoji||"🛒",n:x.name,q:x.qty||"",p:x.price,c:x.category,pid:x.id,sid:x.store_id,sn:S[x.store_id].name,d:S[x.store_id].d}));
    MSG="No local stores deliver to your location yet. We are adding more soon!";
  }catch(e){P=[];MSG="Could not load stores. Check your internet and try again."}
  cart={};cats=["All",...new Set(P.map(p=>p.c))];cat="All";renderChips();renderGrid();renderBar();
}
P=[];cats=["All"];
renderChips();renderGrid();renderBar();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
</body>
</html>
