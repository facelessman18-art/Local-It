<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Local It Admin</title>
<style>
:root{--bg:#f4f7e6;--s:#fff;--ink:#0f3a2c;--m:#5d7468;--l:#dbe4c8;--a:#ff6a2b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1f18;--s:#15302a;--ink:#eaf5df;--m:#9bb5a6;--l:#27463b}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:820px;margin:0 auto}h1{font-size:24px;margin:0 0 12px}
input,select,button{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--l);background:var(--s);color:var(--ink)}
button{cursor:pointer;background:var(--ink);color:var(--bg);border:0;font-weight:700}
button.o{background:var(--a);color:#fff}button.x{background:none;color:#c0392b;border:1.5px solid #c0392b}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{background:var(--s);color:var(--ink);border:1.5px solid var(--l)}.tabs button.on{background:var(--ink);color:var(--bg)}
.c{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:10px;line-height:1.5}
.m{color:var(--m);font-size:14px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.r input{flex:1;min-width:90px}.hide{display:none}#err{color:#c0392b}
</style></head><body><div class="w">
<h1>Local It Admin</h1>
<div id="login" class="c"><div class="r"><input id="em" type="email" placeholder="Admin email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Login</button></div><div id="err"></div></div>
<div id="app" class="hide">
<div class="tabs"><button data-t="orders" class="on">Orders</button><button data-t="products">Products</button><button id="out" style="margin-left:auto">Logout</button></div>
<div id="orders"></div>
<div id="products" class="hide">
<div class="c"><b>Add product</b><div class="r" style="margin-top:8px"><input id="ne" placeholder="Emoji" style="max-width:70px"><input id="nn" placeholder="Name"><input id="nq" placeholder="Qty (500 g)"><input id="np" type="number" placeholder="Price ₹"><input id="nc" placeholder="Category"><button class="o" id="add">Add</button></div></div>
<div id="plist"></div></div></div>
<script>
const SB="https://gxkdzqfhdjqzyregazyy.supabase.co",KEY="sb_publishable_U4PaFyaP1VQCDDrSwF0tPw_G4Os5WpD";let tok=null,tab="orders";
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,method,body){
  const r=await fetch(SB+"/rest/v1/"+path,{method:method||"GET",headers:{apikey:KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json",Prefer:"return=minimal"},body:body?JSON.stringify(body):undefined});
  if(r.status===401){logout();throw new Error("expired")}
  if(!r.ok)throw new Error(await r.text());
  return (method&&method!=="GET")?null:r.json();
}
async function login(){
  $("err").textContent="";
  const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});
  const d=await r.json();
  if(!r.ok){$("err").textContent="Login failed. Check email and password.";return}
  tok=d.access_token;try{sessionStorage.setItem("lt",tok)}catch(e){}start();
}
function logout(){tok=null;try{sessionStorage.removeItem("lt")}catch(e){}$("app").classList.add("hide");$("login").classList.remove("hide")}
function start(){$("login").classList.add("hide");$("app").classList.remove("hide");loadOrders();loadProducts()}
const ST=["placed","packing","on_the_way","delivered","cancelled"];
async function loadOrders(){
  try{const o=await api("orders?select=*,order_items(*)&order=created_at.desc&limit=50");
  $("orders").innerHTML=o.length?o.map(x=>`<div class="c"><b>₹${x.total}</b> · ${esc(x.customer_name)} · <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a><div class="m">${esc(x.address)}</div><div>${x.order_items.map(i=>i.quantity+"× "+esc(i.product_name)).join(", ")}</div><div class="m">${new Date(x.created_at).toLocaleString()}</div><select data-o="${x.id}">${ST.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join(""):'<p class="m">No orders yet.</p>'}catch(e){}
}
async function loadProducts(){
  try{const p=await api("products?select=*&order=id");
  $("plist").innerHTML=p.map(x=>`<div class="c r"><span style="font-size:26px">${esc(x.emoji)}</span><b style="flex:1;min-width:110px">${esc(x.name)}<div class="m">${esc(x.qty)} · ${esc(x.category)}</div></b>₹<input type="number" value="${x.price}" data-p="${x.id}" style="max-width:90px"><label class="m"><input type="checkbox" data-s="${x.id}" ${x.in_stock?"checked":""} style="min-width:0"> In stock</label><button class="x" data-del="${x.id}">Delete</button></div>`).join("")}catch(e){}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="go")login();
  else if(b.id==="out")logout();
  else if(b.dataset.t){tab=b.dataset.t;document.querySelectorAll(".tabs [data-t]").forEach(x=>x.classList.toggle("on",x===b));$("orders").classList.toggle("hide",tab!=="orders");$("products").classList.toggle("hide",tab!=="products")}
  else if(b.id==="add"){
    const n=$("nn").value.trim(),p=parseInt($("np").value,10),c=$("nc").value.trim();
    if(!n||!p||!c){alert("Name, price and category are required");return}
    try{await api("products","POST",{emoji:$("ne").value.trim()||"🛒",name:n,qty:$("nq").value.trim(),price:p,category:c});["ne","nn","nq","np","nc"].forEach(i=>$(i).value="");loadProducts()}catch(err){alert("Could not add product")}
  }
  else if(b.dataset.del&&confirm("Delete this product?")){try{await api("products?id=eq."+b.dataset.del,"DELETE");loadProducts()}catch(err){alert("Delete failed")}}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  try{
    if(t.dataset.o)await api("orders?id=eq."+t.dataset.o,"PATCH",{status:t.value});
    else if(t.dataset.p)await api("products?id=eq."+t.dataset.p,"PATCH",{price:parseInt(t.value,10)});
    else if(t.dataset.s)await api("products?id=eq."+t.dataset.s,"PATCH",{in_stock:t.checked});
  }catch(err){alert("Update failed")}
});
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
setInterval(()=>{if(tok&&tab==="orders")loadOrders()},15000);
try{const t=sessionStorage.getItem("lt");if(t){tok=t;start()}}catch(e){}
</script></div></body></html>
