<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Local It Store Panel</title>
<style>
:root{--bg:#f4f7e6;--s:#fff;--ink:#0f3a2c;--m:#5d7468;--l:#dbe4c8;--a:#ff6a2b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1f18;--s:#15302a;--ink:#eaf5df;--m:#9bb5a6;--l:#27463b}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:820px;margin:0 auto}h1{font-size:24px;margin:0 0 12px}
input,select,button{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--l);background:var(--s);color:var(--ink)}
button{cursor:pointer;background:var(--ink);color:var(--bg);border:0;font-weight:700}
button.o{background:var(--a);color:#fff}button.x{background:none;color:#c0392b;border:1.5px solid #c0392b}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--s);color:var(--ink);border:1.5px solid var(--l)}.tabs button.on{background:var(--ink);color:var(--bg)}
.c{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:10px;line-height:1.5}
.m{color:var(--m);font-size:14px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.r input{flex:1;min-width:90px}.hide{display:none}#err{color:#c0392b}
</style></head><body><div class="w">
<h1 id="ttl">Local It Panel</h1>
<div id="login" class="c"><div class="r"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Login</button></div><div id="err"></div></div>
<div id="app" class="hide">
<div class="tabs"><button data-t="orders" class="on">Orders</button><button data-t="products">Products</button><button data-t="stores" id="stab">Stores</button><button id="out" style="margin-left:auto">Logout</button></div>
<div id="orders"></div>
<div id="products" class="hide">
<div class="c"><b>Add product</b><div class="r" style="margin-top:8px"><select id="ns"></select><input id="ne" placeholder="Emoji" style="max-width:70px"><input id="nn" placeholder="Name"><input id="nq" placeholder="Qty (500 g)"><input id="np" type="number" placeholder="Price ₹"><input id="nc" placeholder="Category"><input id="nf" type="file" accept="image/*" aria-label="Photo"><button class="o" id="add">Add</button></div></div>
<input type="file" id="pf" accept="image/*" class="hide">
<div id="plist"></div></div>
<div id="stores" class="hide">
<div class="c" id="addStore"><b>Add store</b><div class="r" style="margin-top:8px"><input id="sn" placeholder="Store name"><input id="so" type="email" placeholder="Owner email (must have a login)"><input id="sp" placeholder="Phone"><input id="sa" placeholder="Address"><input id="sf" placeholder="FSSAI no."><button class="o" id="addS">Add</button></div></div>
<div id="slist"></div></div></div>
<script>
const SB="https://gxkdzqfhdjqzyregazyy.supabase.co",KEY="sb_publishable_U4PaFyaP1VQCDDrSwF0tPw_G4Os5WpD";let imgTarget=null,tok=null,tab="orders",isStore=false,SID=null,S=[],SN={},seen=null;
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,method,body){
  const r=await fetch(SB+"/rest/v1/"+path,{method:method||"GET",headers:{apikey:KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json",Prefer:"return=minimal"},body:body?JSON.stringify(body):undefined});
  if(r.status===401){logout();throw new Error("expired")}
  if(!r.ok)throw new Error(await r.text());
  return (method&&method!=="GET")?null:r.json();
}
function shrink(f){return new Promise((res,rej)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("resize failed")),"image/jpeg",0.82)};i.onerror=()=>rej(new Error("bad image"));i.src=u})}
async function upload(f){const b=await shrink(f),n=crypto.randomUUID()+".jpg";const r=await fetch(SB+"/storage/v1/object/product-images/"+n,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+tok,"Content-Type":"image/jpeg"},body:b});if(!r.ok)throw new Error(await r.text());return SB+"/storage/v1/object/public/product-images/"+n}
async function login(){
  $("err").textContent="";
  const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});
  const d=await r.json();
  if(!r.ok){$("err").textContent="Login failed. Check email and password.";return}
  tok=d.access_token;try{sessionStorage.setItem("lt",tok)}catch(e){}start();
}
function logout(){tok=null;seen=null;try{sessionStorage.removeItem("lt")}catch(e){}$("app").classList.add("hide");$("login").classList.remove("hide")}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},500)}catch(e){}}
async function start(){
  $("login").classList.add("hide");$("app").classList.remove("hide");
  let me="";try{me=JSON.parse(atob(tok.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).email.toLowerCase()}catch(e){}
  await loadStores(me);loadOrders();loadProducts();
}
let ME="";
async function loadStores(me){
  if(me)ME=me;
  try{const all=await api("stores?select=*&order=created_at");const mine=all.filter(s=>(s.owner_email||"").toLowerCase()===ME);
  isStore=mine.length>0;S=isStore?mine:all;SID=isStore?mine[0].id:null;SN={};all.forEach(s=>SN[s.id]=s.name);
  $("ttl").textContent=isStore?mine[0].name+" · Store panel":"Local It Admin";
  $("addStore").classList.toggle("hide",isStore);$("ns").classList.toggle("hide",isStore);$("stab").textContent=isStore?"My store":"Stores";
  $("ns").innerHTML=S.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");renderStores()}catch(e){}
}
function renderStores(){
  $("slist").innerHTML=S.map(s=>`<div class="c"><div class="r"><input data-f="name" value="${esc(s.name)}" placeholder="Store name"><input data-f="phone" value="${esc(s.phone)}" placeholder="Phone"></div><div class="r" style="margin-top:6px"><input data-f="address" value="${esc(s.address)}" placeholder="Address"><input data-f="fssai" value="${esc(s.fssai)}" placeholder="FSSAI no."></div><div class="r" style="margin-top:6px">${isStore?"":`<input data-f="owner_email" value="${esc(s.owner_email)}" placeholder="Owner email">`}<input data-f="radius_km" type="number" step="0.5" value="${s.radius_km}" style="max-width:90px"> km<label class="m"><input type="checkbox" data-f="is_open" ${s.is_open?"checked":""} style="min-width:0"> Open</label></div><div class="m">${s.lat!=null?"📍 Location set":"⚠️ Location not set. Tap the button while standing at the shop."}</div><div class="r" style="margin-top:6px"><button data-sv="${s.id}">Save</button><button class="o" data-gps="${s.id}">Set location (I am at the shop)</button>${isStore?"":`<button class="x" data-sdel="${s.id}">Delete</button>`}</div></div>`).join("");
}
const ST=["placed","accepted","packing","on_the_way","delivered","cancelled"];
async function loadOrders(){
  try{const o=await api("orders?select=*,order_items(*)&order=created_at.desc&limit=50"+(isStore?"&store_id=eq."+SID:""));
  if(seen===null)seen=new Set(o.map(x=>x.id));else{const nw=o.filter(x=>!seen.has(x.id));if(nw.length){beep();nw.forEach(x=>seen.add(x.id))}}
  $("orders").innerHTML=o.length?o.map(x=>`<div class="c"><b>₹${x.total}</b> · ${esc(x.customer_name)} · <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>${isStore?"":`<div class="m">Store: ${esc(SN[x.store_id]||"none")}</div>`}<div class="m">${esc(x.address)}</div><div>${x.order_items.map(i=>i.quantity+"× "+esc(i.product_name)).join(", ")}</div><div class="m">${new Date(x.created_at).toLocaleString()}</div><select data-o="${x.id}">${ST.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join(""):'<p class="m">No orders yet.</p>'}catch(e){}
}
async function loadProducts(){
  try{const p=await api("products?select=*&order=id"+(isStore?"&store_id=eq."+SID:""));
  $("plist").innerHTML=p.map(x=>`<div class="c r">${x.image_url&&x.image_url.startsWith("https://")?`<img src="${esc(x.image_url)}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px">`:`<span style="font-size:26px">${esc(x.emoji)}</span>`}<b style="flex:1;min-width:110px">${esc(x.name)}<div class="m">${esc(x.qty)} · ${esc(x.category)}${isStore?"":" · "+esc(SN[x.store_id]||"no store")}</div></b>₹<input type="number" value="${x.price}" data-p="${x.id}" style="max-width:90px"><label class="m"><input type="checkbox" data-s="${x.id}" ${x.in_stock?"checked":""} style="min-width:0"> In stock</label><button data-img="${x.id}">📷 Photo</button><button class="x" data-del="${x.id}">Delete</button></div>`).join("")}catch(e){}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  try{
  if(b.id==="go")login();
  else if(b.id==="out")logout();
  else if(b.dataset.t){tab=b.dataset.t;document.querySelectorAll(".tabs [data-t]").forEach(x=>x.classList.toggle("on",x===b));["orders","products","stores"].forEach(t=>$(t).classList.toggle("hide",tab!==t))}
  else if(b.id==="add"){
    const n=$("nn").value.trim(),p=parseInt($("np").value,10),c=$("nc").value.trim(),sid=isStore?SID:$("ns").value;
    if(!n||!p||!c||!sid){alert("Store, name, price and category are required");return}
    let img=null;const f=$("nf").files[0];if(f)img=await upload(f);
    await api("products","POST",{store_id:sid,emoji:$("ne").value.trim()||"🛒",name:n,qty:$("nq").value.trim(),price:p,category:c,image_url:img});$("nf").value="";
    ["ne","nn","nq","np","nc"].forEach(i=>$(i).value="");loadProducts();
  }
  else if(b.id==="addS"){
    const n=$("sn").value.trim(),o=$("so").value.trim().toLowerCase();
    if(!n||!o){alert("Store name and owner email are required");return}
    await api("stores","POST",{name:n,owner_email:o,phone:$("sp").value.trim(),address:$("sa").value.trim(),fssai:$("sf").value.trim()});
    ["sn","so","sp","sa","sf"].forEach(i=>$(i).value="");loadStores();
  }
  else if(b.dataset.sv){
    const o={};b.closest(".c").querySelectorAll("[data-f]").forEach(i=>{o[i.dataset.f]=i.type==="checkbox"?i.checked:i.type==="number"?(parseFloat(i.value)||4):i.value.trim()});
    if(o.owner_email!==undefined)o.owner_email=o.owner_email.toLowerCase();
    await api("stores?id=eq."+b.dataset.sv,"PATCH",o);alert("Saved");loadStores();
  }
  else if(b.dataset.gps){
    const id=b.dataset.gps;
    if(!navigator.geolocation){alert("Location not supported");return}
    navigator.geolocation.getCurrentPosition(async p=>{try{await api("stores?id=eq."+id,"PATCH",{lat:p.coords.latitude,lng:p.coords.longitude});alert("Location saved");loadStores()}catch(err){alert("Could not save location")}},()=>alert("Please allow location access"),{timeout:10000});
  }
  else if(b.dataset.sdel&&confirm("Delete this store and all its products?")){await api("stores?id=eq."+b.dataset.sdel,"DELETE");loadStores();loadProducts()}
  else if(b.dataset.img){imgTarget=b.dataset.img;$("pf").click()}
  else if(b.dataset.del&&confirm("Delete this product?")){await api("products?id=eq."+b.dataset.del,"DELETE");loadProducts()}
  }catch(err){alert("Something went wrong. Please try again.")}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  try{
    if(t.id==="pf"){const f=t.files[0];t.value="";if(f&&imgTarget){const u=await upload(f);await api("products?id=eq."+imgTarget,"PATCH",{image_url:u});loadProducts()}}
    else if(t.dataset.o)await api("orders?id=eq."+t.dataset.o,"PATCH",{status:t.value});
    else if(t.dataset.p)await api("products?id=eq."+t.dataset.p,"PATCH",{price:parseInt(t.value,10)});
    else if(t.dataset.s)await api("products?id=eq."+t.dataset.s,"PATCH",{in_stock:t.checked});
  }catch(err){alert("Update failed")}
});
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
setInterval(()=>{if(tok)loadOrders()},10000);
try{const t=sessionStorage.getItem("lt");if(t){tok=t;start()}}catch(e){}
</script></div></body></html>
